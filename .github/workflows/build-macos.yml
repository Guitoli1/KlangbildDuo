name: macOS Build (AU + VST3)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: "Konfigurieren (Universal: Apple Silicon + Intel)"
        run: >
          cmake -B build -G Xcode
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Kompilieren
        run: cmake --build build --config Release --parallel 4

      # Sicherheitsnetz: Die NAM-Modelltypen müssen im fertigen Plugin enthalten sein
      - name: NAM-Code im Plugin prüfen
        run: |
          BIN="build/KlangbildDuo_artefacts/Release/AU/Klangbild Duo.component/Contents/MacOS/Klangbild Duo"
          COUNT=$(nm -C "$BIN" | grep -c "nam::wavenet" || true)
          echo "WaveNet-Symbole: $COUNT"
          test "$COUNT" -gt 0

      - name: Ad-hoc signieren
        run: |
          cd build/KlangbildDuo_artefacts/Release
          codesign --force --deep --sign - "AU/Klangbild Duo.component"
          codesign --force --deep --sign - "VST3/Klangbild Duo.vst3"
          codesign --force --deep --sign - "Standalone/Klangbild Duo.app"

      - name: Paket schnüren
        run: |
          mkdir -p dist
          cd build/KlangbildDuo_artefacts/Release
          ditto -c -k --sequesterRsrc --keepParent "AU/Klangbild Duo.component"  "$GITHUB_WORKSPACE/dist/Klangbild-Duo-AU.zip"
          ditto -c -k --sequesterRsrc --keepParent "VST3/Klangbild Duo.vst3"      "$GITHUB_WORKSPACE/dist/Klangbild-Duo-VST3.zip"
          ditto -c -k --sequesterRsrc --keepParent "Standalone/Klangbild Duo.app" "$GITHUB_WORKSPACE/dist/Klangbild-Duo-Standalone.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Klangbild-Duo-macOS
          path: dist/

      # Apples offizieller AU-Test (derselbe, den Logic Pro beim Scannen macht)
      - name: AU-Validierung (auval)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/KlangbildDuo_artefacts/Release/AU/Klangbild Duo.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 3
          auval -v aufx Kbdu Klbd
